<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Material Purchases</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
            color: #2c3e50;
        }

        h1 {
            color: #000000;
            border-bottom: 3px solid #ac0606;
            padding-bottom: 10px;
        }

        .layout {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .table-section {
            flex: 2;
        }

        .form-section {
            flex: 1;
            position: sticky;
            top: 20px;
        }

        #searchBox {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #8b4545;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f0f3f7;
        }

        .edit-btn {
            background-color: #3a6ea5;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .edit-btn:hover {
            background-color: #2c557f;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            margin-top: 20px;
            background-color: #ac0606;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: #83060f;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
        }

        .Pending {
            background-color: #e67e22;
        }

        .Ordered {
            background-color: #2980b9;
        }

        .Received {
            background-color: #27ae60;
        }
    </style>
</head>

<body>

<h1>Material Purchases</h1>

<div class="layout">

    <div class="table-section">

        <input
                type="text"
                id="searchBox"
                placeholder="Search by material or status..."
                onkeyup="filterTable()">

        <table id="purchaseTable">

            <tr>
                <th>ID</th>
                <th>Material</th>
                <th>Unit</th>
                <th>Order</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Handled By</th>
                <th>Action</th>
            </tr>

            <tr th:each="p : ${purchases}">

                <td th:text="${p.purchaseId}"></td>

                <td th:text="${materialTypeMap[p.materialTypeId]?.materialName}"></td>

                <td th:text="${materialTypeMap[p.materialTypeId]?.unit}"></td>

                <td th:text="${p.orderId}"></td>

                <td th:text="${p.quantity}"></td>

                <td>
                    <span
                            class="status-badge"
                            th:classappend="${p.status}"
                            th:text="${p.status}">
                    </span>
                </td>

                <td th:text="${p.handledBy}"></td>

                <td>
                    <button
                            type="button"
                            class="edit-btn"
                            th:attr="onclick=${'editRow(' + p.purchaseId + ',' + p.materialTypeId + ',' + (p.orderId != null ? p.orderId : 'null') + ',' + p.quantity + ',&quot;' + p.status + '&quot;,' + p.handledBy + ')'}">
                        Edit
                    </button>
                </td>

            </tr>

        </table>

    </div>


    <div class="form-section">

        <h2 id="formTitle">Add Purchase</h2>

        <form
                th:action="@{/material-purchases}"
                th:object="${newPurchase}"
                method="post">

            <input
                    type="hidden"
                    id="purchaseId"
                    th:field="*{purchaseId}"/>


            <label>Material Type</label>

            <select
                    id="materialTypeId"
                    th:field="*{materialTypeId}"
                    onchange="updateUnit()">

                <option
                        th:each="mt : ${materialTypes}"
                        th:value="${mt.materialTypeId}"
                        th:text="${mt.materialName}"
                        th:attr="data-unit=${mt.unit}">
                </option>

            </select>


            <label>Order (optional)</label>

            <input
                    type="number"
                    id="orderId"
                    th:field="*{orderId}"/>


            <label>
                Quantity <span id="unitLabel"></span>
            </label>

            <input
                    type="number"
                    id="quantity"
                    th:field="*{quantity}"
                    min="1"/>


            <label>Status</label>

            <select
                    id="status"
                    th:field="*{status}">

                <option value="Pending">Pending</option>
                <option value="Ordered">Ordered</option>
                <option value="Received">Received</option>

            </select>


            <label>Handled By</label>

            <select
                    id="handledBy"
                    th:field="*{handledBy}">

                <option
                        th:each="s : ${staffList}"
                        th:value="${s.staffId}"
                        th:text="${s.firstName + ' ' + s.lastName}">
                </option>

            </select>


            <button
                    type="submit"
                    id="submitBtn">
                Add Purchase
            </button>

        </form>

    </div>

</div>


<script>

    function updateUnit() {

        var select = document.getElementById("materialTypeId");

        var selectedOption =
            select.options[select.selectedIndex];

        var unit =
            selectedOption.getAttribute("data-unit");

        document.getElementById("unitLabel").innerText =
            unit ? "(" + unit + ")" : "";
    }


    window.onload = updateUnit;


    function editRow(
        purchaseId,
        materialTypeId,
        orderId,
        quantity,
        status,
        handledBy
    ) {

        document.getElementById("purchaseId").value =
            purchaseId;

        document.getElementById("materialTypeId").value =
            materialTypeId;

        document.getElementById("orderId").value =
            orderId === "null" ? "" : orderId;

        document.getElementById("quantity").value =
            quantity;

        document.getElementById("status").value =
            status;

        document.getElementById("handledBy").value =
            handledBy;

        document.getElementById("formTitle").innerText =
            "Edit Purchase";

        document.getElementById("submitBtn").innerText =
            "Update Purchase";

        updateUnit();
    }


    function filterTable() {

        var input =
            document.getElementById("searchBox").value.toUpperCase();

        var rows =
            document.getElementById("purchaseTable")
                .getElementsByTagName("tr");

        for (var i = 1; i < rows.length; i++) {

            var materialCell =
                rows[i].getElementsByTagName("td")[1];

            var statusCell =
                rows[i].getElementsByTagName("td")[5];

            if (materialCell && statusCell) {

                var text =
                    (
                        materialCell.textContent +
                        statusCell.textContent
                    ).toUpperCase();

                rows[i].style.display =
                    text.indexOf(input) > -1 ? "" : "none";
            }
        }
    }

</script>

</body>
</html>
